name: Energy Tracker CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test-docker:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout Code
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 2️⃣ Setup Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 3️⃣ Build Microservices
      - name: Build User Service
        run: mvn -B clean install -DskipTests -f user-service/pom.xml

      - name: Build Device Service
        run: mvn -B clean install -DskipTests -f device-service/pom.xml

      - name: Build Ingestion Service
        run: mvn -B clean install -DskipTests -f ingestion-service/pom.xml

      - name: Build Usage Service
        run: mvn -B clean install -DskipTests -f usage-service/pom.xml

      - name: Build Alert Service
        run: mvn -B clean install -DskipTests -f alert-service/pom.xml

      - name: Build Insight Service
        run: mvn -B clean install -DskipTests -f insight-service/pom.xml

      # 4️⃣ Build Docker Images
      - name: Build Docker Images
        run: docker compose build

      # 5️⃣ Validate Docker Compose Configuration
      - name: Validate Docker Compose
        run: docker compose config
