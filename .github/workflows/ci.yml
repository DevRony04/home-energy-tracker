name: Energy Tracker CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build All Services
        run: |
          mvn -B clean install --file user-service/pom.xml
          mvn -B clean install --file device-service/pom.xml
          mvn -B clean install --file ingestion-service/pom.xml
          mvn -B clean install --file usage-service/pom.xml
          mvn -B clean install --file alert-service/pom.xml
          mvn -B clean install --file insight-service/pom.xml

      - name: Run Tests
        run: mvn test

      - name: Build Docker Images
        run: docker compose build

      - name: Validate Docker Compose
        run: docker compose config
